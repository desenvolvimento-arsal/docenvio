<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · DocEnvio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e4e8c'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>D</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: var(--bg); }
    .login { width: 100%; max-width: 380px; padding: 24px; }
    .login .brand { text-align: center; margin-bottom: 22px; }
    .login .logo { width: 52px; height: 52px; border-radius: 13px; background: linear-gradient(135deg, var(--primary), var(--success)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 24px; margin: 0 auto 12px; }
    .login h1 { font-size: 19px; }
    .login p.sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
    .card-login { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 24px; }
    .msg-erro { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: none; }
    .foot { text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="login">
    <div class="brand">
      <div class="logo">D</div>
      <h1>DocEnvio</h1>
      <p class="sub">Envio de guias e boletos por WhatsApp</p>
    </div>
    <div class="card-login">
      <div class="msg-erro" id="erro"></div>
      <form id="form">
        <div class="field"><label>E-mail</label>
          <input id="email" type="email" placeholder="voce@escritorio.com" autocomplete="username" required /></div>
        <div class="field"><label>Senha</label>
          <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required /></div>
        <button class="btn block" type="submit" id="btn">Entrar</button>
      </form>
    </div>
    <div class="foot">Não tem conta? Fale com o administrador do escritório.</div>
  </div>

  <script src="/js/icons.js"></script>
  <script>
    const form = document.getElementById('form');
    const erro = document.getElementById('erro');
    const btn = document.getElementById('btn');

    // já logado? vai direto pro sistema
    fetch('/api/auth/me').then((r) => { if (r.ok) location.href = '/'; }).catch(() => {});

    form.onsubmit = async (e) => {
      e.preventDefault();
      erro.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, senha: document.getElementById('senha').value }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { erro.textContent = data.error || 'Não foi possível entrar.'; erro.style.display = 'block'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
        location.href = '/';
      } catch (err) { erro.textContent = 'Erro de conexão com o servidor.'; erro.style.display = 'block'; btn.disabled = false; btn.textContent = 'Entrar'; }
    };
  </script>
</body>
</html>
