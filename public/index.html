<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocEnvio · Guias &amp; Boletos por WhatsApp</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e4e8c'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>D</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">D</div>
        <h1>DocEnvio</h1>
        <span>Escritório Contábil</span>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-group">
          <h2>Principal</h2>
          <div class="nav-item" data-route="rapido"><span class="ico" data-icon="zap"></span> Envio Rápido</div>
          <div class="nav-item" data-route="dashboard"><span class="ico" data-icon="grid"></span> Dashboard</div>
          <div class="nav-item" data-route="envio"><span class="ico" data-icon="send"></span> Envio de Guias</div>
        </div>
        <div class="nav-group">
          <h2>Cadastros</h2>
          <div class="nav-item" data-route="clientes"><span class="ico" data-icon="users"></span> Clientes</div>
          <div class="nav-item" data-route="documentos"><span class="ico" data-icon="folder"></span> Guias &amp; Boletos</div>
        </div>
        <div class="nav-group">
          <h2>Configurações</h2>
          <div class="nav-item" data-route="tipos-documento"><span class="ico" data-icon="tag"></span> Tipos de Guia</div>
          <div class="nav-item" data-route="tipos-pagamento"><span class="ico" data-icon="card"></span> Formas de Pagamento</div>
        </div>
        <div class="nav-group" id="nav-admin" hidden>
          <h2>Administração</h2>
          <div class="nav-item" data-route="admin"><span class="ico" data-icon="shield"></span> Contas</div>
        </div>
      </nav>
      <div class="sidebar-foot">DocEnvio v1.0 · Envio via Evolution API</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb">DocEnvio &nbsp;/&nbsp; <b id="crumb">Dashboard</b></div>
        <div class="topbar-right">
          <div class="wa-status" id="waStatus"><span class="dot"></span> <span>Verificando…</span></div>
          <div class="user-menu" id="userMenu">
            <div class="user-av" id="userAv">?</div>
            <div class="user-info"><div class="user-nome" id="userNome"></div><div class="user-role" id="userRole"></div></div>
            <button class="btn ghost sm" id="logout" title="Sair">Sair</button>
          </div>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
