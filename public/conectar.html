<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conectar WhatsApp · DocEnvio</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: var(--bg); }
    .connect { width: 100%; max-width: 460px; text-align: center; padding: 24px; }
    .connect .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--success)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 22px; margin: 0 auto 14px; }
    .connect h1 { font-size: 20px; margin-bottom: 4px; }
    .connect p.sub { color: var(--text-2); font-size: 13.5px; margin-bottom: 22px; }
    .qr-box { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; }
    .qr-box img { width: 264px; height: 264px; image-rendering: pixelated; }
    .qr-loading { width: 264px; height: 264px; display: grid; place-items: center; margin: 0 auto; color: var(--text-2); }
    .steps { text-align: left; margin: 20px auto 0; max-width: 340px; font-size: 13px; color: var(--text-2); }
    .steps li { margin-bottom: 6px; }
    .connected { background: var(--success-soft); border: 1px solid #bfe6d2; border-radius: 14px; padding: 34px 22px; }
    .connected .ico { width: 56px; height: 56px; color: var(--success); margin: 0 auto 14px; }
    .connected h2 { color: #17824e; font-size: 20px; margin-bottom: 6px; }
    .foot { margin-top: 20px; font-size: 12.5px; color: var(--text-2); }
    .refresh-note { font-size: 12px; color: var(--text-2); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="connect">
    <div class="logo">D</div>
    <h1>Conectar WhatsApp</h1>
    <p class="sub">Instância <b id="inst">docenvio</b> · Evolution API</p>
    <div id="painel"></div>
    <div class="foot"><a href="/" style="color:var(--primary);font-weight:600">← Voltar ao sistema</a></div>
  </div>

  <script src="/js/icons.js"></script>
  <script>
    const painel = document.getElementById('painel');
    let conectado = false;

    async function tick() {
      try {
        const r = await fetch('/api/whatsapp/qr').then((x) => x.json());
        if (r.conectado) return showConnected();
        if (r.base64) {
          painel.innerHTML = `
            <div class="qr-box"><img src="${r.base64}" alt="QR Code WhatsApp" /></div>
            <ol class="steps">
              <li>Abra o <b>WhatsApp Business</b> no celular</li>
              <li>Toque em <b>⋮ → Dispositivos conectados</b></li>
              <li>Toque em <b>Conectar um dispositivo</b></li>
              <li>Aponte a câmera para este QR Code</li>
            </ol>
            <div class="refresh-note">O código é atualizado automaticamente.</div>`;
        } else if (!painel.querySelector('.qr-box')) {
          painel.innerHTML = `<div class="qr-box"><div class="qr-loading">${icon('spinner','spin')} Gerando QR…</div></div>`;
        }
      } catch (e) {
        painel.innerHTML = `<div class="qr-box"><div class="qr-loading">Erro: ${e.message}</div></div>`;
      }
    }

    function showConnected() {
      if (conectado) return;
      conectado = true;
      painel.innerHTML = `<div class="connected">${icon('check')}<h2>WhatsApp conectado!</h2>
        <p style="color:#2c6b4b;font-size:13.5px">Já pode enviar documentos pelo sistema.</p></div>`;
      setTimeout(() => (location.href = '/#envio'), 2500);
    }

    tick();
    const timer = setInterval(() => { if (!conectado) tick(); else clearInterval(timer); }, 6000);
  </script>
</body>
</html>
